<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Mines Duel: two pickaxes crossed over one shared field, a gem for whoever digs deeper. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3648"/>
      <stop offset=".5" stop-color="#08222f"/>
      <stop offset=".5" stop-color="#2a1c02"/>
      <stop offset="1" stop-color="#4a3204"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6cc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff6cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3a14"/>
      <stop offset=".5" stop-color="#8a5e26"/>
      <stop offset="1" stop-color="#5a3a14"/>
    </linearGradient>
    <linearGradient id="diaHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8ecff"/>
      <stop offset=".5" stop-color="#1aa7d6"/>
      <stop offset="1" stop-color="#06415a"/>
    </linearGradient>
    <linearGradient id="goldHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cc"/>
      <stop offset=".5" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#a35f00"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0a0c" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>
  <path d="M0 0H300V400Z" fill="#ffffff" fill-opacity=".03"/>
  <circle cx="150" cy="150" r="130" fill="url(#glow)"/>
  <!-- pickaxe one: diamond -->
  <g transform="translate(150 152) rotate(-42)">
    <rect x="-7" y="-20" width="14" height="150" rx="6" fill="#000" fill-opacity=".3" transform="translate(5 6)"/>
    <rect x="-8" y="-20" width="16" height="150" rx="7" fill="url(#handle)"/>
    <path d="M-96-2C-64-50 64-50 96-2L82 10C50-20-50-20-82 10Z" fill="url(#diaHead)"/>
    <path d="M-96-2C-64-50 64-50 96-2L91 2C58-38-58-38-91 2Z" fill="#dff8ff" fill-opacity=".8"/>
    <rect x="-12" y="-36" width="24" height="26" rx="5" fill="#0a3648"/>
  </g>
  <!-- pickaxe two: gold -->
  <g transform="translate(150 152) rotate(42)">
    <rect x="-7" y="-20" width="14" height="150" rx="6" fill="#000" fill-opacity=".3" transform="translate(5 6)"/>
    <rect x="-8" y="-20" width="16" height="150" rx="7" fill="url(#handle)"/>
    <path d="M-96-2C-64-50 64-50 96-2L82 10C50-20-50-20-82 10Z" fill="url(#goldHead)"/>
    <path d="M-96-2C-64-50 64-50 96-2L91 2C58-38-58-38-91 2Z" fill="#ffffff" fill-opacity=".7"/>
    <rect x="-12" y="-36" width="24" height="26" rx="5" fill="#4a3204"/>
  </g>
  <!-- the spark where they meet -->
  <g transform="translate(150 118)">
    <path d="M0-30L8-8L30 0L8 8L0 30L-8 8L-30 0L-8-8Z" fill="#ffffff"/>
    <circle r="7" fill="#fff6cc"/>
  </g>
  <rect y="250" width="300" height="150" fill="url(#foot)"/>
</svg>
