  <g fill="#ffffff">
    <path d="M66 82l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" fill-opacity=".95"/>
    <path d="M292 64l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill-opacity=".85"/>
    <path d="M300 200l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill-opacity=".7"/>
