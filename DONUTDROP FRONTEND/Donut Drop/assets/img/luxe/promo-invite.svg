    <path d="M0-70C-16-98-50-106-52-90" fill="none" stroke="#fff6cc" stroke-width="4" stroke-linecap="round"/>
    <path d="M0-70C-10-56-22-38-36-28L-22-30L-14-18C-6-36 0-54 0-70Z" fill="#d98800"/>
    <path d="M0-70C10-56 22-38 36-28L22-30L14-18C6-36 0-54 0-70Z" fill="#d98800"/>
    <circle cx="0" cy="-70" r="14" fill="#ffd700" stroke="#a35f00" stroke-width="3"/>
