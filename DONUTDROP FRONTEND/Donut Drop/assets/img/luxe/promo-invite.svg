<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
  <!-- Invite and earn: a gift tied in gold, for the friend and for you. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#2f2f38"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffaa00" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffaa00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2412f"/>
      <stop offset="1" stop-color="#8e2318"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a82d20"/>
      <stop offset="1" stop-color="#5a120c"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a45"/>
      <stop offset="1" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98800"/>
      <stop offset=".5" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#d98800"/>
    </linearGradient>
  </defs>
  <rect width="360" height="360" fill="url(#bg)"/>
  <circle cx="180" cy="176" r="170" fill="url(#glow)"/>
  <ellipse cx="180" cy="300" rx="118" ry="18" fill="#000" fill-opacity=".5"/>
  <g transform="translate(180 210)">
