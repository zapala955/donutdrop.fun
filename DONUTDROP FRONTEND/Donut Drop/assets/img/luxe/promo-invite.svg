    <rect x="18" y="-34" width="78" height="122" rx="0" fill="url(#boxSide)" fill-opacity=".55"/>
    <rect x="-18" y="-34" width="36" height="122" fill="url(#ribbon)"/>
    <rect x="-108" y="-70" width="216" height="44" rx="10" fill="url(#lid)"/>
    <rect x="-18" y="-70" width="36" height="44" fill="url(#ribbon)"/>
    <path d="M-100-62H100" stroke="#ffffff" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
    <!-- bow -->
    <path d="M0-70C-22-110-74-118-70-86C-66-62-26-66 0-70Z" fill="url(#ribbon)"/>
