<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Mines: a cut diamond over the hidden field, the TNT waiting in the corner. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#0a3648"/>
      <stop offset=".6" stop-color="#08222f"/>
      <stop offset="1" stop-color="#041017"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#0091c4" stop-opacity=".75"/>
      <stop offset="1" stop-color="#0091c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c4a5e"/>
      <stop offset="1" stop-color="#0d2c3a"/>
    </linearGradient>
    <linearGradient id="tnt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2222"/>
      <stop offset=".6" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#8e2318"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#041017" stop-opacity="0"/>
      <stop offset="1" stop-color="#041017" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>
  <g fill="url(#tile)" stroke="#2b6b86" stroke-opacity=".5" stroke-width="2">
    <rect x="18" y="214" width="62" height="62" rx="10"/>
    <rect x="88" y="214" width="62" height="62" rx="10"/>
    <rect x="150" y="214" width="62" height="62" rx="10" transform="translate(8 0)"/>
    <rect x="228" y="214" width="62" height="62" rx="10"/>
    <rect x="18" y="284" width="62" height="62" rx="10"/>
    <rect x="88" y="284" width="62" height="62" rx="10"/>
    <rect x="158" y="284" width="62" height="62" rx="10"/>
    <rect x="228" y="284" width="62" height="62" rx="10"/>
  </g>
  <circle cx="160" cy="150" r="128" fill="url(#glow)"/>
  <!-- the diamond -->
  <g transform="translate(160 150)">
    <ellipse cx="6" cy="96" rx="78" ry="12" fill="#000" fill-opacity=".35"/>
    <path d="M-86-22L-48-70H48L86-22L0 86Z" fill="#0091c4"/>
    <path d="M-86-22H86L0 86Z" fill="#0a6f97"/>
    <path d="M-86-22L-30-22L0 86Z" fill="#0b5a7b"/>
    <path d="M30-22H86L0 86Z" fill="#06415a"/>
    <path d="M-30-22H30L0 86Z" fill="#1aa7d6"/>
    <path d="M-48-70L-30-22H-86Z" fill="#5fd0f5"/>
    <path d="M-48-70L0-22L-30-22Z" fill="#a8ecff"/>
    <path d="M-48-70H48L0-22Z" fill="#dff8ff"/>
    <path d="M48-70L30-22L0-22Z" fill="#7fdcfa"/>
    <path d="M48-70L86-22H30Z" fill="#2fb6e6"/>
    <path d="M-48-70L-36-62H32L48-70Z" fill="#ffffff" fill-opacity=".9"/>
    <path d="M-60-34L-40-60L-34-52L-52-30Z" fill="#ffffff" fill-opacity=".85"/>
  </g>
  <!-- the TNT -->
  <g transform="translate(58 70) rotate(-14)">
    <rect x="-30" y="-24" width="60" height="50" rx="6" fill="url(#tnt)"/>
    <rect x="-30" y="-8" width="60" height="16" fill="#ffffff"/>
    <rect x="-30" y="-8" width="60" height="16" fill="none" stroke="#2a1c02" stroke-opacity=".25"/>
    <path d="M-20-24V26M-6-24V26M8-24V26M22-24V26" stroke="#8e2318" stroke-opacity=".55" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="Archivo, Arial, sans-serif" font-weight="900" font-size="13" fill="#2a1c02">TNT</text>
    <path d="M2-24C4-34 12-38 20-36" fill="none" stroke="#d9c7a0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="22" cy="-37" r="6" fill="#ffd700"/>
    <circle cx="22" cy="-37" r="3" fill="#ffffff"/>
  </g>
  <g fill="#ffffff">
    <path d="M250 64l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill-opacity=".85"/>
    <path d="M228 120l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill-opacity=".6"/>
  </g>
  <rect y="250" width="300" height="150" fill="url(#foot)"/>
</svg>
