<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- Plinko: the peg pyramid, a gold ball mid-drop, and the payout slots. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#e2412f"/>
      <stop offset=".55" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#6e1a12"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd700" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peg" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9cf"/>
    </radialGradient>
    <radialGradient id="ball" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff6cc"/>
      <stop offset=".45" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#d98800"/>
    </radialGradient>
    <linearGradient id="slotHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#ffaa00"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a100a" stop-opacity="0"/>
      <stop offset="1" stop-color="#4a100a" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>
  <circle cx="150" cy="120" r="140" fill="url(#glow)"/>
  <g fill="url(#peg)">
    <circle cx="150" cy="70" r="7"/>
    <circle cx="126" cy="104" r="7"/><circle cx="174" cy="104" r="7"/>
    <circle cx="102" cy="138" r="7"/><circle cx="150" cy="138" r="7"/><circle cx="198" cy="138" r="7"/>
    <circle cx="78" cy="172" r="7"/><circle cx="126" cy="172" r="7"/><circle cx="174" cy="172" r="7"/><circle cx="222" cy="172" r="7"/>
    <circle cx="54" cy="206" r="7"/><circle cx="102" cy="206" r="7"/><circle cx="150" cy="206" r="7"/><circle cx="198" cy="206" r="7"/><circle cx="246" cy="206" r="7"/>
    <circle cx="30" cy="240" r="7"/><circle cx="78" cy="240" r="7"/><circle cx="126" cy="240" r="7"/><circle cx="174" cy="240" r="7"/><circle cx="222" cy="240" r="7"/><circle cx="270" cy="240" r="7"/>
  </g>
  <path d="M150 34C150 60 140 86 138 100C136 116 160 126 162 150" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <circle cx="166" cy="164" r="13" fill="#4a100a" fill-opacity=".35"/>
  <circle cx="162" cy="158" r="17" fill="url(#ball)"/>
  <ellipse cx="156" cy="151" rx="6" ry="4" fill="#ffffff" fill-opacity=".9" transform="rotate(-30 156 151)"/>
  <g>
    <rect x="9" y="266" width="36" height="22" rx="5" fill="url(#slotHot)"/>
    <rect x="50" y="266" width="36" height="22" rx="5" fill="#ffaa00"/>
    <rect x="91" y="266" width="36" height="22" rx="5" fill="#d98800"/>
    <rect x="132" y="266" width="36" height="22" rx="5" fill="#a35f00"/>
    <rect x="173" y="266" width="36" height="22" rx="5" fill="#d98800"/>
    <rect x="214" y="266" width="36" height="22" rx="5" fill="#ffaa00"/>
    <rect x="255" y="266" width="36" height="22" rx="5" fill="url(#slotHot)"/>
  </g>
  <rect y="250" width="300" height="150" fill="url(#foot)"/>
</svg>
