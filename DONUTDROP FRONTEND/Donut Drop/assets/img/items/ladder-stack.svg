<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Stack">
  <!-- Tier 2 - $1M to $8M. Three coins: the same unit as the Chip, multiplied. The silhouette is
       what has to read at tile size, so the tiers differ by shape and not only by colour. -->
  <g fill="#8a6500">
    <rect x="3" y="9" width="10" height="4"/><rect x="2" y="10" width="12" height="2"/>
    <rect x="3" y="5" width="10" height="4"/><rect x="2" y="6" width="12" height="2"/>
    <rect x="3" y="1" width="10" height="4"/><rect x="2" y="2" width="12" height="2"/>
  </g>
  <g fill="#ffd700">
    <rect x="3" y="10" width="10" height="2"/><rect x="4" y="9" width="8" height="1"/>
    <rect x="3" y="6" width="10" height="2"/><rect x="4" y="5" width="8" height="1"/>
    <rect x="3" y="2" width="10" height="2"/><rect x="4" y="1" width="8" height="1"/>
  </g>
  <g fill="#ffaa00">
    <rect x="4" y="12" width="8" height="1"/><rect x="4" y="8" width="8" height="1"/>
    <rect x="4" y="4" width="8" height="1"/>
  </g>
  <g fill="#fff3a8">
    <rect x="4" y="10" width="2" height="1"/><rect x="4" y="6" width="2" height="1"/>
    <rect x="4" y="2" width="2" height="1"/>
  </g>
</svg>
