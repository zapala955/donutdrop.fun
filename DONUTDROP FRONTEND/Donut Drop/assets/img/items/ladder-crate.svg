<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Crate">
  <!-- Tier 3 - $10M to $80M. A crate of bullion: the point at which the prize stops being counted
       in coins. Square silhouette, so it cannot be mistaken for the round tiers below it. -->
  <rect x="1" y="4" width="14" height="10" fill="#4a3410"/>
  <rect x="2" y="5" width="12" height="8" fill="#7a5418"/>
  <g fill="#ffd700">
    <rect x="3" y="6" width="5" height="3"/><rect x="9" y="6" width="4" height="3"/>
    <rect x="3" y="10" width="4" height="3"/><rect x="8" y="10" width="5" height="3"/>
  </g>
  <g fill="#ffaa00">
    <rect x="3" y="8" width="5" height="1"/><rect x="9" y="8" width="4" height="1"/>
    <rect x="3" y="12" width="4" height="1"/><rect x="8" y="12" width="5" height="1"/>
  </g>
  <g fill="#fff3a8">
    <rect x="3" y="6" width="5" height="1"/><rect x="9" y="6" width="4" height="1"/>
    <rect x="3" y="10" width="4" height="1"/><rect x="8" y="10" width="5" height="1"/>
  </g>
  <rect x="1" y="2" width="14" height="2" fill="#8a6500"/>
  <rect x="2" y="2" width="12" height="1" fill="#c99700"/>
</svg>
