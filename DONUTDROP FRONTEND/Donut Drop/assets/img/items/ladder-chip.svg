<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Chip">
  <!-- Tier 1 - $100K to $800K. A single coin: the smallest denomination on the ladder.
       Drawn on the same 16x16 grid as the Minecraft sprites beside it, because the tiles render
       with image-rendering: pixelated and a smooth vector would be the only soft thing on screen. -->
  <g fill="#8a6500">
    <rect x="6" y="2" width="4" height="1"/><rect x="4" y="3" width="8" height="1"/>
    <rect x="3" y="4" width="10" height="1"/><rect x="2" y="5" width="12" height="6"/>
    <rect x="3" y="11" width="10" height="1"/><rect x="4" y="12" width="8" height="1"/>
    <rect x="6" y="13" width="4" height="1"/>
  </g>
  <g fill="#ffd700">
    <rect x="6" y="3" width="4" height="1"/><rect x="4" y="4" width="8" height="1"/>
    <rect x="3" y="5" width="10" height="6"/><rect x="4" y="11" width="8" height="1"/>
    <rect x="6" y="12" width="4" height="1"/>
  </g>
  <g fill="#ffaa00">
    <rect x="7" y="5" width="2" height="6"/><rect x="5" y="6" width="6" height="1"/>
    <rect x="5" y="9" width="6" height="1"/>
  </g>
  <g fill="#fff3a8">
    <rect x="5" y="4" width="3" height="1"/><rect x="4" y="5" width="2" height="1"/>
  </g>
</svg>
