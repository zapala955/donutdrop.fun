<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Empty means same origin, which keeps the session cookie and strict origin check aligned. -->
<meta name="api-base-url" content="" />
<!-- An admin console has no business being indexed, previewed or unfurled anywhere. -->
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="referrer" content="no-referrer" />
<title>Donut Drop — Admin</title>
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<!--
  The token arrives in the URL FRAGMENT (`/admin/#<token>`), never the path or the query.

  A fragment is not transmitted in an HTTP request at all, which is what makes the one-time link
  survive being posted in Discord: the unfurler fetches `/admin/`, gets this page, and cannot see
  or spend the credential. The same property keeps the token out of access logs, out of proxy
  logs, and out of the Referer header on every subsequent request.

  admin.js reads it, POSTs it once, and clears it from the address bar immediately.
-->

<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true"></span>
    <span class="brand__text">Donut Drop <b>Admin</b></span>
  </div>
  <div class="who" id="who" hidden>
    <span class="who__name" id="whoName"></span>
    <button class="btn btn--ghost" type="button" id="signOut">Sign out</button>
  </div>
</header>

<!-- The three states this page can be in. Exactly one is ever visible. -->
<main id="main">

  <section class="gate" id="gate" aria-live="polite">
    <div class="gate__card">
      <h1 class="gate__title" id="gateTitle">Opening your session…</h1>
      <p class="gate__body" id="gateBody">Verifying the link you were given.</p>
      <p class="gate__hint" id="gateHint" hidden>
        Run <code>/dashboard</code> in Discord to mint a new one.
      </p>
    </div>
  </section>

  <div class="console" id="console" hidden>

    <nav class="tabs" aria-label="Sections">
      <button class="tab" type="button" data-panel="overview" aria-selected="true">Overview</button>
      <button class="tab" type="button" data-panel="players" aria-selected="false">Players</button>
      <button class="tab" type="button" data-panel="bots" aria-selected="false">Bots</button>
      <button class="tab" type="button" data-panel="jobs" aria-selected="false">Jobs</button>
      <button class="tab" type="button" data-panel="items" aria-selected="false">Items</button>
    </nav>

    <section class="panel" data-panel="overview">
      <div class="panel__head">
        <h2>Overview</h2>
        <button class="btn" type="button" data-refresh="overview">Refresh</button>
      </div>
      <div class="stats" id="overviewStats"></div>
    </section>

    <section class="panel" data-panel="players" hidden>
      <div class="panel__head">
        <h2>Players</h2>
        <form class="search" id="playerSearch" role="search">
          <label class="search__label" for="playerQuery">Search players</label>
          <input class="search__input" id="playerQuery" type="search" name="q"
                 placeholder="Username…" autocomplete="off" maxlength="64" />
          <button class="btn" type="submit">Search</button>
        </form>
      </div>
      <div class="tablewrap"><table class="grid" id="playerTable"></table></div>
    </section>

    <section class="panel" data-panel="bots" hidden>
      <div class="panel__head">
        <h2>Bots</h2>
        <button class="btn" type="button" data-refresh="bots">Refresh</button>
      </div>
      <div class="tablewrap"><table class="grid" id="botTable"></table></div>
    </section>

    <section class="panel" data-panel="jobs" hidden>
      <div class="panel__head">
        <h2>Jobs</h2>
        <button class="btn" type="button" data-refresh="jobs">Refresh</button>
      </div>
      <div class="tablewrap"><table class="grid" id="jobTable"></table></div>
    </section>

    <section class="panel" data-panel="items" hidden>
      <div class="panel__head">
        <h2>Observed items</h2>
        <!-- The upgrader's fixed prize ladder is set here rather than in a migration or a seed
             file, because every catalogue price has to carry an operator and a reason. -->
        <button class="btn" type="button" id="publishLadder">Publish upgrade ladder</button>
        <button class="btn" type="button" data-refresh="items">Refresh</button>
      </div>
      <div class="tablewrap"><table class="grid" id="itemTable"></table></div>
    </section>

  </div>
</main>

<!-- Destructive actions confirm here, for the same reason they confirm in Discord. -->
<dialog class="confirm" id="confirm" aria-labelledby="confirmTitle">
  <form method="dialog" class="confirm__form">
    <h2 class="confirm__title" id="confirmTitle">Confirm</h2>
    <p class="confirm__body" id="confirmBody"></p>
    <label class="confirm__label" for="confirmReason">Reason (recorded in the audit log)</label>
    <input class="confirm__input" id="confirmReason" name="reason" type="text"
           minlength="3" maxlength="256" required autocomplete="off" />
    <div class="confirm__actions">
      <!-- formnovalidate, because the reason field beside it is `required`. Without this the
           browser runs constraint validation on Cancel too and refuses to submit, so an operator
           who opens the dialog and thinks better of it cannot close it without first inventing a
           reason for the thing they have decided not to do. -->
      <button class="btn btn--ghost" type="submit" value="cancel" formnovalidate>Cancel</button>
      <button class="btn btn--danger" type="submit" value="go" id="confirmGo">Confirm</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="admin.js"></script>
</body>
</html>
