    /mines-duel "Mines Duel on DonutWin: play mines head to head against another player.";
    /skill-duel "Challenge another player to a 1v1 skill duel for DonutSMP money on DonutWin.";
    /blackjack "Play blackjack against the dealer with DonutSMP money on DonutWin.";
    /roulette "Play roulette with DonutSMP money on DonutWin.";
    /referrals "Invite players to DonutWin and earn a share of the house margin on what they play, never a cut of their losses.";
