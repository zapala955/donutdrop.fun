worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

# ═══════════════════════════════════════════════════════════════════════════
# The public edge: one origin serving both the site and the API.
# ═══════════════════════════════════════════════════════════════════════════
#
# WHY ONE ORIGIN AND NOT TWO
# --------------------------
# The session cookie is SameSite=Strict and every mutation is checked against an EXACT
# `Origin` match (see `requireCsrf` in lib/auth.ts — a constant-time string compare against
# APP_ORIGIN, not a hostname or prefix test). Serving the frontend from one host and the API
# from another means the browser sends an Origin the API does not recognise, and every
# authenticated action fails while the site itself looks perfectly healthy.
#
# So the static files and the API answer on the same name, and the split is by PATH.
#
# WHAT IS ROUTED WHERE
# --------------------
#   /internal/   refused outright. These are the HMAC-signed bot and Discord routes. They are
#                signature-gated rather than session-gated, and nothing on the public internet
#                has any business reaching them even with a valid signature.
#   /v1/         the API. Rate limited.
#   /health/     liveness and readiness. Not rate limited: a probe that gets throttled reports
#                an outage that is not happening.
#   everything   static files from the frontend bundle.
#
# The rate limit deliberately does NOT cover static assets. A player loading the site pulls
# dozens of files at once, and counting those against an API budget throttles exactly the
# people behaving normally.

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 64k;
  client_body_timeout 10s;
  keepalive_timeout 30s;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;
  resolver 127.0.0.11 valid=10s ipv6=off;

  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Traffic published on host loopback enters this fixed bridge through its
  # gateway. Only that gateway may provide the client address set by the host
  # TLS proxy; all other client forwarding headers remain untrusted.
  set_real_ip_from 172.29.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  upstream api_backend {
    zone api_backend 64k;
    server api:3001 resolve;
    keepalive 32;
  }

  # Shared by every proxied location. Forwarding headers are REPLACED rather than appended:
  # whatever a client sent is not evidence of anything.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # TLS terminates in the host proxy. Accept only the one value that means HTTPS and fall back to
  # the real hop scheme for every malformed or absent header.
  map $http_x_forwarded_proto $forwarded_proto {
    https   https;
    default $scheme;
  }

  server {
    listen 8080;
    root /srv/www;
    index index.html;

    # ── never reachable from outside ──
    location ^~ /internal/ { return 404; }

    # ── the API ──
    location ^~ /v1/ {
      limit_req zone=public_api burst=30 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Forwarded "";

      # The arena, case battles and duels are WebSockets. Without these two headers the
      # upgrade is stripped and the socket silently falls back to a failed HTTP request.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 3s;
      # Long enough for a socket to idle between frames. The arena ticks at 20Hz, but a
      # spectator on an empty pit can legitimately go quiet, and the hub's own 30s heartbeat
      # is what decides a socket is dead — not this timeout.
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;

      include /etc/nginx/security-headers.conf;
    }

    # ── health probes: unthrottled on purpose ──
    location ^~ /health/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Forwarded "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;

      add_header Cache-Control "no-store" always;
      include /etc/nginx/security-headers.conf;
    }

    # ── public static assets ──
    # Asset names are stable rather than content-hashed, so browsers must revalidate them after a
    # deploy. Nginx still serves Last-Modified/ETag validators, keeping unchanged reloads cheap.
    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # The admin bundle is deliberately allowlisted so README, source-tooling and other files in
    # the bind-mounted frontend directory cannot become public by accident.
    location ~ ^/admin/(?:admin\.js|admin\.css)$ {
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location = /admin { return 308 /admin/; }

    # The only public HTML documents. The app itself routes on the fragment (#/slither).
    location ~ ^/(?:index\.html)?$ {
      add_header Cache-Control "no-store" always;
      include /etc/nginx/security-headers.conf;
      try_files /index.html =404;
    }

    location ~ ^/admin/(?:index\.html)?$ {
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      include /etc/nginx/security-headers.conf;
      try_files /admin/index.html =404;
    }

    # Do not turn the source checkout into a general-purpose file server.
    location / {
      include /etc/nginx/security-headers.conf;
      return 404;
    }
  }
}
