    /upgrader "The DonutWin upgrader: choose a bigger target, see your winning window on the wheel, and play for it with DonutSMP money.";
    /crash "Play crash with DonutSMP money on DonutWin: the multiplier climbs until it crashes, so cash out before it does.";
