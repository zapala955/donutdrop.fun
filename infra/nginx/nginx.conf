  map $uri $seo_url {
    default "https://donutwin.fun/";
    /home "https://donutwin.fun/";
    /crates "https://donutwin.fun/crates";
    /battles "https://donutwin.fun/battles";
    /upgrader "https://donutwin.fun/upgrader";
    /crash "https://donutwin.fun/crash";
    /mines "https://donutwin.fun/mines";
    /plinko "https://donutwin.fun/plinko";
    /coinflip "https://donutwin.fun/coinflip";
    /mines-duel "https://donutwin.fun/mines-duel";
    /skill-duel "https://donutwin.fun/skill-duel";
    /blackjack "https://donutwin.fun/blackjack";
    /roulette "https://donutwin.fun/roulette";
    /referrals "https://donutwin.fun/referrals";
    /fairness "https://donutwin.fun/fairness";
    /vip "https://donutwin.fun/vip";
    /daily-rewards "https://donutwin.fun/daily-rewards";
    /race "https://donutwin.fun/race";
    /leaderboard "https://donutwin.fun/leaderboard";
    /discord "https://donutwin.fun/discord";
    /creator-media "https://donutwin.fun/creator-media";
    /support "https://donutwin.fun/support";
    /terms "https://donutwin.fun/terms";
    /profile "https://donutwin.fun/profile";
    /wallet "https://donutwin.fun/wallet";
    /history "https://donutwin.fun/history";
    /settings "https://donutwin.fun/settings";
    /statistics "https://donutwin.fun/statistics";
    /rewards "https://donutwin.fun/rewards";
    /rakeback "https://donutwin.fun/rewards";
    /studio "https://donutwin.fun/studio";
    /war "https://donutwin.fun/war";
    /quests "https://donutwin.fun/quests";
  }
  map $uri $seo_robots {
    default "index, follow";
    /home "index, follow";
    /crates "index, follow";
    /battles "index, follow";
    /upgrader "index, follow";
    /crash "index, follow";
    /mines "index, follow";
    /plinko "index, follow";
    /coinflip "index, follow";
    /mines-duel "index, follow";
    /skill-duel "index, follow";
    /blackjack "index, follow";
    /roulette "index, follow";
    /referrals "index, follow";
    /fairness "index, follow";
    /vip "index, follow";
    /daily-rewards "index, follow";
    /race "index, follow";
    /leaderboard "index, follow";
    /discord "index, follow";
    /creator-media "index, follow";
    /support "index, follow";
    /terms "index, follow";
    /profile "noindex, follow";
    /wallet "noindex, follow";
    /history "noindex, follow";
    /settings "noindex, follow";
    /statistics "noindex, follow";
    /rewards "noindex, follow";
    /rakeback "noindex, follow";
    /studio "noindex, follow";
    /war "noindex, follow";
    /quests "noindex, follow";
  }
  # ── end seo maps ──

  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Traffic published on host loopback enters this fixed bridge through its
  # gateway. Only that gateway may provide the client address set by the host
  # TLS proxy; all other client forwarding headers remain untrusted.
  set_real_ip_from 172.29.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  upstream api_backend {
    zone api_backend 64k;
    server api:3001 resolve;
    keepalive 32;
  }

  # Shared by every proxied location. Forwarding headers are REPLACED rather than appended:
  # whatever a client sent is not evidence of anything.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # TLS terminates in the host proxy. Accept only the one value that means HTTPS and fall back to
  # the real hop scheme for every malformed or absent header.
  map $http_x_forwarded_proto $forwarded_proto {
    https   https;
    default $scheme;
  }

  server {
    listen 8080;
    root /srv/www;
    index index.html;

    # ── never reachable from outside ──
    location ^~ /internal/ { return 404; }

    # ── the API ──
    location ^~ /v1/ {
      limit_req zone=public_api burst=30 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Forwarded "";

      # The arena, case battles and duels are WebSockets. Without these two headers the
      # upgrade is stripped and the socket silently falls back to a failed HTTP request.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 3s;
      # Long enough for a socket to idle between frames. The arena ticks at 20Hz, but a
      # spectator on an empty pit can legitimately go quiet, and the hub's own 30s heartbeat
      # is what decides a socket is dead — not this timeout.
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;

      include /etc/nginx/security-headers.conf;
    }

    # ── health probes: unthrottled on purpose ──
    location ^~ /health/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Forwarded "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;

      add_header Cache-Control "no-store" always;
      include /etc/nginx/security-headers.conf;
    }

    # ── public static assets ──
    # Asset names are stable rather than content-hashed, so browsers must revalidate them after a
    # deploy. Nginx still serves Last-Modified/ETag validators, keeping unchanged reloads cheap.
    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # The admin bundle is deliberately allowlisted so README, source-tooling and other files in
    # the bind-mounted frontend directory cannot become public by accident.
    #
    # no-store, matching the HTML that loads it, rather than the revalidate policy /assets/ uses.
    # The two files have to agree with each other: /admin/index.html is no-store and therefore
    # always fresh, so a cached admin.js means new markup wired to old code. That failure is
    # completely silent — the markup renders, the script that would have bound its handlers never
    # arrives, and a button simply does nothing. It cost an afternoon.
    #
    # "must-revalidate" was not enough because it is only a promise to the BROWSER, and a CDN in
    # front of this is free to cache the response and to rewrite the max-age it passes on; the
    # Cloudflare default for that is four hours. no-store is the one instruction every layer
    # honours. The console is an internal page loaded a few times a week, so there is nothing to
    # gain by caching it and a whole class of bug to lose.
    location ~ ^/admin/(?:admin\.js|admin\.css)$ {
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location = /admin { return 308 /admin/; }

    # What crawlers ask for first. Named one by one, like everything else served from the source
    # checkout; without these the catch-all below answered both with a 404 and Google had no map of
    # the site at all.
    location = /robots.txt {
      add_header Cache-Control "public, max-age=3600" always;
      include /etc/nginx/security-headers.conf;
      try_files /robots.txt =404;
    }

    location = /sitemap.xml {
      add_header Cache-Control "public, max-age=3600" always;
      include /etc/nginx/security-headers.conf;
      try_files /sitemap.xml =404;
    }

    # The public shell at the origin root.
    location ~ ^/(?:index\.html)?$ {
      add_header Cache-Control "no-store" always;
      include /etc/nginx/security-headers.conf;
      try_files /index.html =404;
    }

    # Clean single-page-app routes. Keep this list explicit: the frontend directory is a source
    # checkout, so a catch-all fallback would accidentally make non-public files downloadable.
    # Route state lives in the path now (/terms, /crates), never in a #/ fragment.
    location ~ ^/(?:home|crates|battles|skill-duel|referrals|studio|upgrader|roulette|blackjack|crash|mines|plinko|mines-duel|coinflip|quests|war|fairness|vip|rewards|rakeback|daily-rewards|discord|race|creator-media|leaderboard|statistics|profile|wallet|history|settings|support|terms)$ {
      add_header Cache-Control "no-store" always;
      include /etc/nginx/security-headers.conf;
      # The home page's title, description, canonical and robots, swapped for this route's (the
      # seo maps above), so a link preview that reads only the HTML sees the right page.
      # ── seo substitutions: generated by infra/nginx/seo-map.mjs, do not edit by hand ──
      sub_filter_once off;
      sub_filter 'DonutWin.fun — DonutSMP Crash, Mines, Coinflip &amp; Cases' '$seo_title';
      sub_filter 'Play crash, mines, plinko, coinflip, blackjack, roulette, cases, case battles and the upgrader with DonutSMP money. Deposit and withdraw in game.' '$seo_description';
      sub_filter '<link rel="canonical" href="https://donutwin.fun/" />' '<link rel="canonical" href="$seo_url" />';
      sub_filter '<meta property="og:url" content="https://donutwin.fun/" />' '<meta property="og:url" content="$seo_url" />';
      sub_filter '<meta name="robots" content="index, follow" />' '<meta name="robots" content="$seo_robots" />';
      # ── end seo substitutions ──
      try_files /index.html =404;
    }

    location ~ ^/admin/(?:index\.html)?$ {
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      include /etc/nginx/security-headers.conf;
      try_files /admin/index.html =404;
    }

    # Do not turn the source checkout into a general-purpose file server.
    location / {
      include /etc/nginx/security-headers.conf;
      return 404;
    }
  }
}
