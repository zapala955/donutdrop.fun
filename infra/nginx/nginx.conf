    /blackjack "DonutWin Blackjack — DonutSMP Blackjack";
    /roulette "DonutWin Roulette — DonutSMP Roulette";
    /referrals "DonutWin Referrals — Invite &amp; Earn";
    /fairness "DonutWin Provably Fair — Verify a Round";
    /vip "DonutWin VIP &amp; Rakeback";
    /daily-rewards "DonutWin Daily Rewards";
    /race "DonutWin Wager Race";
    /leaderboard "DonutWin Leaderboard";
    /discord "DonutWin Discord — Join &amp; Link Your Account";
    /creator-media "DonutWin Creator &amp; Media Programme";
    /support "DonutWin Support";
    /terms "DonutWin Terms";
    /profile "DonutWin Profile";
    /wallet "DonutWin Wallet";
    /history "DonutWin History";
    /settings "DonutWin Settings";
    /statistics "DonutWin Statistics";
    /rewards "DonutWin Rewards";
    /rakeback "DonutWin Rewards";
    /studio "DonutWin Case Studio";
    /war "DonutWin Faction War";
