worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/json;
  server_tokens off;
  client_max_body_size 64k;
  client_body_timeout 10s;
  keepalive_timeout 30s;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Traffic published on host loopback enters this fixed bridge through its
  # gateway. Only that gateway may provide the client address set by the host
  # TLS proxy; all other client forwarding headers remain untrusted.
  set_real_ip_from 172.29.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  upstream api_backend {
    zone api_backend 64k;
    server api:3001 resolve;
    keepalive 32;
  }

  server {
    listen 8080;

    location ^~ /internal/ { return 404; }

    location / {
      limit_req zone=public_api burst=30 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Replace, rather than append, forwarding headers supplied by an untrusted client.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Forwarded "";
      proxy_set_header Connection "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
  }
}
