    /vip "The DonutWin VIP levels and the rakeback each level pays back on your wagers.";
    /daily-rewards "Claim a free DonutSMP money reward on DonutWin every day; keep a streak for more.";
    /race "The DonutWin wager race: every wager on the site counts, and the top of the board wins the prize pool.";
    /leaderboard "The top DonutWin players.";
    /discord "Join the DonutWin Discord, then link your account with /link for the server rewards.";
    /creator-media "Make DonutSMP content? Apply to the DonutWin creator and media programme.";
    /support "Get help with DonutWin deposits, withdrawals and your account.";
    /terms "The DonutWin terms of use.";
    /profile "Your DonutWin profile.";
    /wallet "Your DonutWin balance, deposits and withdrawals.";
    /history "Your DonutWin game and payment history.";
    /settings "Your DonutWin account settings.";
    /statistics "Your DonutWin statistics.";
    /rewards "Claim your DonutWin rakeback and rewards.";
