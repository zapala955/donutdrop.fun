  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Traffic published on host loopback enters this fixed bridge through its
  # gateway. Only that gateway may provide the client address set by the host
  # TLS proxy; all other client forwarding headers remain untrusted.
  set_real_ip_from 172.29.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  upstream api_backend {
    zone api_backend 64k;
    server api:3001 resolve;
    keepalive 32;
  }

  # Shared by every proxied location. Forwarding headers are REPLACED rather than appended:
  # whatever a client sent is not evidence of anything.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # TLS terminates in the host proxy. Accept only the one value that means HTTPS and fall back to
  # the real hop scheme for every malformed or absent header.
  map $http_x_forwarded_proto $forwarded_proto {
    https   https;
    default $scheme;
  }

  server {
    listen 8080;
    root /srv/www;
    index index.html;
    # Redirects say where to go as a path. Behind the host's TLS proxy nginx only knows itself as
    # http on port 8080, and an absolute redirect built from that (/admin, /test) sent visitors to
    # http://donutluxe.com:8080/..., which nothing answers. A relative Location resolves against
    # the address the browser actually used.
    absolute_redirect off;

    # ── never reachable from outside ──
    location ^~ /internal/ { return 404; }

    # ── the API ──
    location ^~ /v1/ {
      limit_req zone=public_api burst=30 nodelay;
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Forwarded "";

      # The arena, case battles and duels are WebSockets. Without these two headers the
      # upgrade is stripped and the socket silently falls back to a failed HTTP request.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_connect_timeout 3s;
      # Long enough for a socket to idle between frames. The arena ticks at 20Hz, but a
      # spectator on an empty pit can legitimately go quiet, and the hub's own 30s heartbeat
      # is what decides a socket is dead — not this timeout.
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;

      include /etc/nginx/security-headers.conf;
    }

    # ── health probes: unthrottled on purpose ──
    location ^~ /health/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Forwarded "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;

      add_header Cache-Control "no-store" always;
      include /etc/nginx/security-headers.conf;
    }

    # ── the built frontend (scripts/build-frontend.mjs, run by infra/vps/build-frontend.sh) ──
    # Every stylesheet and script the page loads lives under /b/<id>/, where <id> is a hash of what
    # was built. A file there never changes, so browsers and Cloudflare may keep it for a year
    # without asking again, and a new release is a new <id>: no visitor can end up running the new
    # page against last release's scripts, which Cloudflare's own four-hour browser cache used to
    # allow (see the admin bundle below for the afternoon that cost).
    location ^~ /b/ {
      root /srv/www/build;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # ── public static assets ──
    # Images, sounds, fonts and the vendored three.js, plus the unbuilt sources the page falls back
    # to when there is no build. Their names are stable rather than content-hashed, so browsers
    # must revalidate them after a deploy; nginx serves Last-Modified/ETag validators, keeping
    # unchanged reloads cheap.
    location ^~ /assets/ {
      add_header Cache-Control "public, max-age=0, must-revalidate" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # The admin bundle is deliberately allowlisted so README, source-tooling and other files in
    # the bind-mounted frontend directory cannot become public by accident.
    #
    # no-store, matching the HTML that loads it, rather than the revalidate policy /assets/ uses.
    # The two files have to agree with each other: /admin/index.html is no-store and therefore
    # always fresh, so a cached admin.js means new markup wired to old code. That failure is
    # completely silent — the markup renders, the script that would have bound its handlers never
    # arrives, and a button simply does nothing. It cost an afternoon.
    #
    # "must-revalidate" was not enough because it is only a promise to the BROWSER, and a CDN in
    # front of this is free to cache the response and to rewrite the max-age it passes on; the
    # Cloudflare default for that is four hours. no-store is the one instruction every layer
    # honours. The console is an internal page loaded a few times a week, so there is nothing to
    # gain by caching it and a whole class of bug to lose.
    location ~ ^/admin/(?:admin\.js|admin\.css)$ {
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    location = /admin { return 308 /admin/; }

    # The first slot machine lived at /slots until slots got a category of their own; it is Ore
    # Rush at /ore-rush now. Shared links and search results carry on to it.
    location = /slots {
      include /etc/nginx/security-headers.conf;
      return 308 /ore-rush$is_args$args;
    }

    # What crawlers ask for first. Named one by one, like everything else served from the source
    # checkout; without these the catch-all below answered both with a 404 and Google had no map of
    # the site at all.
    location = /robots.txt {
      add_header Cache-Control "public, max-age=3600" always;
      include /etc/nginx/security-headers.conf;
      try_files /robots.txt =404;
    }

    # The site's icon at the address every browser and crawler asks for first.
    location = /favicon.ico {
      add_header Cache-Control "public, max-age=86400" always;
      include /etc/nginx/security-headers.conf;
      try_files /favicon.ico =404;
    }

    location = /sitemap.xml {
      add_header Cache-Control "public, max-age=3600" always;
      include /etc/nginx/security-headers.conf;
      try_files /sitemap.xml =404;
    }

    # The IndexNow key: Bing (and Yandex, Seznam, Naver) read it to trust the URLs that
    # scripts/indexnow.mjs submits. It is public by design, and it has to sit at the root for the
    # submission to cover every page on the host.
    location = /b63bc9282f0e07f343341371e6edd2c6.txt {
      add_header Cache-Control "public, max-age=3600" always;
      include /etc/nginx/security-headers.conf;
      try_files /b63bc9282f0e07f343341371e6edd2c6.txt =404;
    }

    # The public shell at the origin root: the built page when there is one, the source otherwise.
    location ~ ^/(?:index\.html)?$ {
      add_header Cache-Control "no-store" always;
      include /etc/nginx/security-headers.conf;
      try_files /build/index.html /index.html =404;
    }

    # Clean single-page-app routes. Keep this list explicit: the frontend directory is a source
    # checkout, so a catch-all fallback would accidentally make non-public files downloadable.
    # Route state lives in the path now (/terms, /crates), never in a #/ fragment.
    location ~ ^/(?:home|crates|battles|skill-duel|referrals|studio|upgrader|roulette|blackjack|crash|mines|tower|chicken|plinko|dice|mines-duel|coinflip|ore-rush|monument|quests|war|fairness|vip|rewards|rakeback|daily-rewards|discord|race|creator-media|leaderboard|statistics|profile|wallet|history|settings|support|terms)$ {
      add_header Cache-Control "no-store" always;
      include /etc/nginx/security-headers.conf;
      # The home page's title, description, canonical and robots, swapped for this route's (the
      # seo maps above), so a link preview that reads only the HTML sees the right page.
      # ── seo substitutions: generated by infra/nginx/seo-map.mjs, do not edit by hand ──
      set $seo_path $uri;
      sub_filter_once off;
      sub_filter 'DonutLuxe – DonutSMP Casino | Crash, Mines, Tower &amp; More' '$seo_title';
      sub_filter 'DonutLuxe is the DonutSMP casino: crash, mines, tower, chicken, plinko, dice, blackjack, roulette, coinflip and case battles. Deposit and withdraw in game.' '$seo_description';
      sub_filter '<link rel="canonical" href="https://donutluxe.com/" />' '<link rel="canonical" href="$seo_url" />';
      sub_filter '<meta property="og:url" content="https://donutluxe.com/" />' '<meta property="og:url" content="$seo_url" />';
      sub_filter '<meta name="robots" content="index, follow" />' '<meta name="robots" content="$seo_robots" />';
      # ── end seo substitutions ──
      try_files /build/index.html /index.html =404;
    }

    # ── the old redesign preview ──
    # The redesign was previewed at /test before it became the site. Links to it were shared, so
    # /test and /test/<route> go to the same page on the live site rather than to a 404.
    # Only a route-shaped name is carried over: anything else (an encoded slash among it) could
    # turn the target into //elsewhere, an open redirect. Those fall through to the 404 below.
    location ~ ^/test(?:/([a-z-]+))?/?$ {
      include /etc/nginx/security-headers.conf;
      return 308 /$1$is_args$args;
    }

    location ~ ^/admin/(?:index\.html)?$ {
      add_header Cache-Control "no-store" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
      include /etc/nginx/security-headers.conf;
      try_files /admin/index.html =404;
    }

    # Do not turn the source checkout into a general-purpose file server.
    location / {
      include /etc/nginx/security-headers.conf;
      return 404;
    }
  }
}
