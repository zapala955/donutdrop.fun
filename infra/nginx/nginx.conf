  map $uri $seo_description {
    default "Play crash, mines, plinko, coinflip, blackjack, roulette, cases, case battles and the upgrader with DonutSMP money. Deposit and withdraw in game.";
    /home "Play crash, mines, plinko, coinflip, blackjack, roulette, cases, case battles and the upgrader with DonutSMP money. Deposit and withdraw in game.";
